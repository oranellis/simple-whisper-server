<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Faster Whisper</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>Sessions</h1>
                <button
                    id="new-session"
                    type="button"
                    title="Start a new session"
                >
                    + New
                </button>
            </div>

            <ul id="session-list" class="session-list"></ul>
        </aside>

        <main class="session-pane">
            <div
                id="empty-state"
                class="empty-state"
            >
                <p>Select a session on the left, or start a new one.</p>
            </div>

            <div
                id="session-view"
                class="session-view"
                hidden
            >
                <div class="recording-bar">
                    <div class="recording-controls">
                        <button
                            id="live-start"
                            type="button"
                        >
                            Start
                        </button>

                        <button
                            id="live-stop"
                            type="button"
                            disabled
                        >
                            Stop
                        </button>

                        <label class="language-field">
                            Language
                            <input
                                id="live-language"
                                type="text"
                                value="en"
                            >
                        </label>
                    </div>

                    <div class="session-details">
                        <span
                            id="session-name"
                            class="session-name"
                        ></span>

                        <span
                            id="live-status"
                            class="status"
                        >
                            Ready
                        </span>
                    </div>
                </div>

                <div
                    id="live-output"
                    class="transcript"
                ></div>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
